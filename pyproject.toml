[project]
name = "ecom-cs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.6",
    "pydantic-settings>=2.15.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["eval: 需要真实上游的标注样例验证"]

[tool.uv]
package = false
