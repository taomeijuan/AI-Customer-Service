<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城小助手 · 电商智能客服</title>
<style>
  :root {
    --brand: #ff5722;
    --brand-soft: #fff3ef;
    --bg: #f4f5f7;
    --bubble-bot: #ffffff;
    --bubble-user: linear-gradient(135deg, #ff7043, #ff5722);
    --text: #26282c;
    --dim: #9aa0a8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #ff7043, #ff5722);
    color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(255,87,34,.25); z-index: 10;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .status { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #b9f6ca; box-shadow: 0 0 4px #b9f6ca; }
  header .new-chat {
    margin-left: auto; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.5); color: #fff;
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px 8px; scroll-behavior: smooth; }
  .row { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .row .avatar {
    background: #fff; border: 1px solid #eee;
    width: 34px; height: 34px; font-size: 18px;
  }
  .row.user .avatar { background: var(--brand-soft); border-color: #ffd9cc; }
  .bubble {
    max-width: 72%; padding: 10px 14px; border-radius: var(--radius);
    font-size: 14.5px; line-height: 1.65; word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .row.bot  .bubble { background: var(--bubble-bot); border-top-left-radius: 4px; }
  .row.user .bubble { background: var(--bubble-user); color: #fff; border-top-right-radius: 4px; }
  .bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .row.user .bubble code { background: rgba(255,255,255,.2); }
  .bubble.error { background: #fff1f0; color: #cf1322; border: 1px solid #ffccc7; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; background: var(--brand-soft); color: #d84315;
    border: 1px solid #ffd0bf; border-radius: 999px; padding: 2px 9px;
  }
  .chip.running { animation: pulse 1s infinite; }
  .chip.fail { background: #fff1f0; color: #cf1322; border-color: #ffccc7; }
  @keyframes pulse { 50% { opacity: .45; } }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--dim);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4 } 30% { transform: translateY(-4px); opacity:1 } }
  .options-bar { display: flex; gap: 8px; margin-top: 8px; }
  .options-bar button {
    border: 1px solid var(--brand); background: #fff; color: var(--brand);
    border-radius: 8px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .options-bar button:disabled { opacity: .5; cursor: not-allowed; }
  sup.cite { color: var(--brand); cursor: pointer; font-weight: 700; font-size: 11px; padding: 0 2px; }
  sup.cite:hover { text-decoration: underline; }
  .cite-detail {
    margin-top: 8px; padding: 8px 10px; background: var(--brand-soft);
    border-left: 3px solid var(--brand); border-radius: 6px; font-size: 12.5px;
  }
  .cite-path { color: #d84315; font-weight: 600; margin-bottom: 4px; }
  .cite-q { font-weight: 600; margin-bottom: 2px; }
  .cite-a { color: #5d4037; }
  .feedback { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .feedback button {
    border: 1px solid #e3e5e8; background: #fff;
    border-radius: 8px; padding: 3px 10px; font-size: 13px; cursor: pointer;
  }
  .feedback button:hover { border-color: var(--brand); }
  .feedback button.on { background: var(--brand-soft); border-color: var(--brand); }
  .feedback .done-tip { font-size: 11.5px; color: var(--dim); }
  .order-cards { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .order-card {
    text-align: left; border: 1px solid #ffd0bf; background: #fff;
    border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px;
  }
  .order-card:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
  .order-card:disabled { cursor: default; opacity: .75; }
  .order-card.picked { border-color: var(--brand); background: var(--brand-soft); }
  .oc-top { font-weight: 700; color: #d84315; font-size: 12.5px; }
  .oc-sub { color: #5d4037; font-size: 12px; margin-top: 2px; }
  .refund-form {
    margin-top: 8px; border: 1px solid #ffe0d4; background: var(--brand-soft);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  .rf-title { font-weight: 700; color: #d84315; margin-bottom: 6px; }
  .rf-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .rf-row label { color: #9aa0a8; width: 34px; flex-shrink: 0; font-size: 12px; }
  .rf-reason { flex: 1; border: 1px solid #e3e5e8; border-radius: 6px; padding: 4px 6px; font-size: 13px; font-family: inherit; }
  .rf-submit { border: none; background: var(--brand); color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .rf-submit:disabled { opacity: .5; cursor: not-allowed; }
  .rf-err { color: #cf1322; font-size: 12px; }
  .rf-sub { color: #5d4037; font-size: 12.5px; }
  footer {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid #ececec;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; border: 1px solid #e3e5e8; border-radius: 10px;
    padding: 11px 14px; font-size: 14.5px; font-family: inherit;
    outline: none; resize: none; max-height: 120px; line-height: 1.5;
  }
  #input:focus { border-color: var(--brand); }
  #send {
    border: none; background: var(--brand); color: #fff;
    border-radius: 10px; padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: var(--dim); padding: 6px 0 10px; }
</style>
</head>
<body>
<header>
  <div class="avatar">🛍️</div>
  <div>
    <h1>商城小助手</h1>
    <div class="status"><span class="dot"></span><span id="statusText">在线 · 为你服务</span></div>
  </div>
  <button class="new-chat" id="newChat">新会话</button>
</header>
<div id="chat">
  <div class="row bot">
    <div class="avatar">🛍️</div>
    <div class="bubble">你好呀～我是商城小助手，可以查订单、物流、商品，也能答售后政策。问点什么？😊</div>
  </div>
</div>
<footer>
  <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</footer>
<div class="hint" id="diag">ch06 · 分流器正式版 · 前端 v2026-10-10b · 等待消息…</div>

<script>
console.log('🖥️ 前端版本 v2026-10-10b');
const diag = document.getElementById('diag');
const stats = { meta: 0, tool: [], delta: 0, citations: -1, errors: '' };
function paintDiag() {
  diag.textContent = `前端 v2026-10-10b · meta ${stats.meta} · tool ${stats.tool.length}${stats.tool.length ? '(' + stats.tool.join(',') + ')' : ''} · delta ${stats.delta} · citations ${stats.citations === -1 ? '—' : stats.citations}${stats.errors ? ' · ⚠️ ' + stats.errors : ''}`;
}
window.onerror = function(msg, src, line) { stats.errors = msg + ' @' + line; paintDiag(); console.error('💥 JS Error:', msg, 'line', line); };
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusText = document.getElementById('statusText');
document.getElementById('newChat');

const uidKey = 'cs_user_id_v1', convKey = 'cs_conversation_id_v2';
let userId = localStorage.getItem(uidKey);
if (!userId) { userId = crypto.randomUUID(); localStorage.setItem(uidKey, userId); }
let conversationId = JSON.parse(localStorage.getItem(convKey) || 'null');
let streaming = false;
let lastOrder = null;  // ch06：订单选择器最近点选的订单（退款表单用）
const REFUND_REASONS = ['七天无理由', '质量问题', '少件', '与描述不符', '其他'];  // 与后端 /api/refunds 同源

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addRow(role) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  row.innerHTML = `<div class="avatar">${role === 'bot' ? '🛍️' : '🙋'}</div>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="tools"></div><div class="text"></div>';
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return bubble;
}

function renderMd(el, text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  el.innerHTML = esc
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function renderAnswer(el, text, citations) {
  renderMd(el, text);
  if (!citations || !citations.length) return;
  el.innerHTML = el.innerHTML.replace(/\[(\d+)\]/g, (m, n) => {
    const c = citations.find(x => x.n === Number(n)) || citations[citations.length - 1];
    if (!c) return m;
    return `<sup class="cite" data-n="${c.n}">[${c.n}]</sup>`;
  });
  el.querySelectorAll('sup.cite').forEach(sup => {
    sup.addEventListener('click', () => showCitation(el, citations, Number(sup.dataset.n)));
  });
}

function showCitation(el, citations, n) {
  const old = el.querySelector('.cite-detail');
  if (old && old.dataset.n === String(n)) { old.remove(); return; }
  if (old) old.remove();
  const c = citations.find(x => x.n === n);
  if (!c) return;
  const card = document.createElement('div');
  card.className = 'cite-detail';
  card.dataset.n = String(n);
  card.innerHTML = '<div class="cite-path"></div><div class="cite-q"></div><div class="cite-a"></div>';
  card.querySelector('.cite-path').textContent = `📂 ${c.section_path}`;
  card.querySelector('.cite-q').textContent = c.question;
  card.querySelector('.cite-a').textContent = c.answer;
  el.appendChild(card);
}

function addToolChip(bubble, name, running) {
  const chips = bubble.querySelector('.tools');
  const chip = document.createElement('span');
  chip.className = 'chip' + (running ? ' running' : '');
  chip.textContent = `🔧 ${name} · ${running ? '查询中' : '完成'}`;
  chips.appendChild(chip);
  return chip;
}

function addFeedback(bubble, answerText) {
  const bar = document.createElement('div');
  bar.className = 'feedback';
  let h = 0;
  for (let i = 0; i < answerText.length; i++) { h = (h * 31 + answerText.charCodeAt(i)) >>> 0; }
  const key = `${conversationId}:${h}`;
  const up = document.createElement('button');
  up.textContent = '👍 有帮助';
  const down = document.createElement('button');
  down.textContent = '👎 没帮助';
  const tip = document.createElement('span');
  tip.className = 'done-tip';
  function lock(choice) {
    up.disabled = down.disabled = true;
    up.classList.toggle('on', choice === 'up');
    down.classList.toggle('on', choice === 'down');
    tip.textContent = '已反馈';
  }
    up.addEventListener('click', () => lock('up'));
    down.addEventListener('click', () => lock('down'));
  bar.append(up, down, tip);
  bubble.appendChild(bar);
}

function addOptionsButtons(bubble, options, contextText, order) {
  const bar = document.createElement('div');
  bar.className = 'options-bar';
  for (const opt of options) {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      btn.disabled = true;
      if (opt === '转人工') {
        const row = addRow('bot');
        row.querySelector('.text').innerHTML =
          '<b>已转接人工客服</b><br>您好，我是客服小猫，请问有什么可以帮您的？🐱';
        scrollBottom();
      } else if (opt === '建工单') {
        fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversation_id: conversationId, description: contextText, ticket_type: '投诉' }),
        })
          .then(r => r.json())
          .then(body => {
            const row = addRow('bot');
            row.querySelector('.text').textContent = `✅ 工单已创建（${body.ticket_no}），人工客服会尽快联系您`;
            scrollBottom();
          })
          .catch(() => { btn.disabled = false; });
      } else if (opt === '申请退款') {
        addRefundForm(bubble, order || lastOrder);  // ch06：优先用帧内订单摘要，兜底最近点选
      }
    });
    bar.appendChild(btn);
  }
  bubble.appendChild(bar);
}

let lastSelectorWrap = null;  // 评审 m4：resume 失败时解禁用
function addOrderCards(bubble, orders) {
  const wrap = document.createElement('div');
  wrap.className = 'order-cards';
  lastSelectorWrap = wrap;
  for (const o of orders) {
    const card = document.createElement('button');
    card.className = 'order-card';
    card.innerHTML = `<div class="oc-top"></div><div class="oc-sub"></div>`;
    card.querySelector('.oc-top').textContent = `📦 订单 ${o.order_no}`;
    card.querySelector('.oc-sub').textContent = `${o.product} · ¥${o.amount} · ${o.status}`;
    card.addEventListener('click', () => {
      if (streaming) return;
      wrap.querySelectorAll('.order-card').forEach(c => { c.disabled = true; });
      card.classList.add('picked');
      lastOrder = o;
      resumeWithOrder(o);  // 点选 → 回填 resume → 子流程续跑
    });
    wrap.appendChild(card);
  }
  bubble.appendChild(wrap);
  scrollBottom();
}

function addRefundForm(bubble, order) {
  if (!order) {
    const warn = document.createElement('div');
    warn.className = 'refund-form';
    warn.innerHTML = '<div class="rf-err">没有可退订单信息，请重新问一次「我要退款」并点选订单</div>';
    bubble.appendChild(warn);
    return;
  }
  const form = document.createElement('div');
  form.className = 'refund-form';
  form.innerHTML = `
    <div class="rf-title">📝 申请退款</div>
    <div class="rf-row"><label>订单</label><span class="rf-order"></span></div>
    <div class="rf-row"><label>金额</label><span class="rf-amount"></span></div>
    <div class="rf-row"><label>原因</label><select class="rf-reason"></select></div>
    <button class="rf-submit">提交退款单</button>`;
  form.querySelector('.rf-order').textContent = `#${order.order_no}`;
  form.querySelector('.rf-amount').textContent = `¥${order.amount}`;
  const sel = form.querySelector('.rf-reason');
  for (const r of REFUND_REASONS) {
    const op = document.createElement('option');
    op.value = r; op.textContent = r;
    sel.appendChild(op);
  }
  form.querySelector('.rf-submit').addEventListener('click', async () => {
    const btn = form.querySelector('.rf-submit');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const resp = await fetch('/api/refunds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          conversation_id: conversationId,
          order_no: order.order_no,
          reason_category: sel.value,
          amount: order.amount,
        }),
      });
      if (!resp.ok) throw new Error('提交失败');
      const body = await resp.json();
      form.innerHTML = `<div class="rf-title">✅ 退款单 ${body.refund_no} 已提交</div><div class="rf-sub">退款原因：${sel.value}，审核通过后原路退回</div>`;
      scrollBottom();
    } catch (e) {
      btn.disabled = false; btn.textContent = '提交退款单';
      if (!form.querySelector('.rf-err')) {
        const tip = document.createElement('span');
        tip.className = 'rf-err'; tip.textContent = ' 提交失败，请重试';
        form.appendChild(tip);
      }
    }
  });
  bubble.appendChild(form);
  scrollBottom();
}

function setBusy(b) {
  streaming = b;
  sendBtn.disabled = b;
  input.disabled = b;
  statusText.textContent = b ? '对方正在输入…' : '在线 · 为你服务';
}

async function streamChat(requestBody, botBubble, contextText) {
  /** SSE 主循环（新消息与 resume 共用）。contextText 供 options 按钮的上下文。 */
  const textEl = botBubble.querySelector('.text');
  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody),
    });
    if (resp.status === 404) {
      conversationId = null;
      localStorage.removeItem(convKey);
      throw new Error('会话已过期，请重新发送');
    }
    if (!resp.ok || !resp.body) throw new Error(`服务异常（HTTP ${resp.status}）`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', firstToken = true, raw = '', toolCount = 0;
    let revealTimer = null, revealPos = 0, afterReveal = null;  // 打字机：固定节奏逐字揭示               闭包内独立于后端块粒度
    function stopReveal() {
      if (revealTimer) { clearInterval(revealTimer); revealTimer = null; }
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();
      for (const block of blocks) {
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        console.log('📡', event, JSON.stringify(payload).slice(0, 100));
        if (event === 'meta') {
          conversationId = payload.conversation_id;
          localStorage.setItem(convKey, JSON.stringify(conversationId));
          stats.meta++; paintDiag();
        } else if (event === 'tool') {
          toolCount++;
          stats.tool.push(payload.tool); paintDiag();
          if (payload.status === 'running') {
            addToolChip(botBubble, payload.tool, true);
            statusText.textContent = `正在调用 ${payload.tool}…`;
          } else {
            // done 帧：优先更新已有 running chip，否则直接创建（ch05 只发 done 帧）
            let chip = null;
            const running = botBubble.querySelectorAll('.chip.running');
            if (running.length) chip = running[running.length - 1];
            else chip = addToolChip(botBubble, payload.tool, false);
            chip.classList.remove('running');
            chip.textContent = `🔧 ${payload.tool} · ${payload.ok ? '完成' : '失败'}`;
            if (!payload.ok) chip.classList.add('fail');
          }
          scrollBottom();
        } else if (event === 'order_selector') {
          // ch06：槽位缺失 → 订单选择器卡片，点选后 resume 续跑
          stats.delta += 0;  // 无正文轮，自诊断行保持
          paintDiag();
          if (textEl.querySelector('.typing')) textEl.textContent = '';
          textEl.innerHTML = '您想退哪一单？点下面的订单卡片继续：';
          addOrderCards(botBubble, payload.orders || []);
        } else if (event === 'options') {
          addOptionsButtons(botBubble, payload.options || [], contextText, payload.order || null);
        } else if (event === 'delta') {
          if (firstToken) { textEl.textContent = ''; firstToken = false; }
          raw += payload.text;
          stats.delta++; paintDiag();
          if (!revealTimer) {  // 恒速打字机：每 28ms 多露 1 字，追平即停
            revealTimer = setInterval(() => {
              revealPos = Math.min(revealPos + 1, raw.length);
              renderMd(textEl, raw.slice(0, revealPos));
              scrollBottom();
              if (revealPos >= raw.length) {
                stopReveal();
                if (afterReveal) { const f = afterReveal; afterReveal = null; f(); }
              }
            }, 28);
          }
          scrollBottom();
        } else if (event === 'error') {
          stopReveal();
          textEl.textContent = '';
          botBubble.classList.add('error');
          renderMd(textEl, payload.message || '服务暂时不可用');
        } else if (event === 'done') {
          const citations = payload.citations || [];
          stats.citations = citations.length; paintDiag();
          const finalize = () => {
            if (citations.length) renderAnswer(textEl, raw, citations);
            if (raw.trim()) addFeedback(botBubble, raw);  // 评审 m4：选择器轮空正文不挂反馈条
            console.log('🔍 本次收到 tool 事件:', toolCount, '条');
          };
          if (revealPos < raw.length) afterReveal = finalize;  // 打字机追完后补引用+反馈
          else finalize();
        }
      }
    }
  } catch (err) {
    stopReveal();
    if (textEl.querySelector('.typing')) textEl.textContent = '';
    botBubble.classList.add('error');
    textEl.textContent = `⚠️ ${err.message || '网络异常，请稍后重试'}`;
    if (requestBody.resume && lastSelectorWrap) {
      // 评审 m4：恢复失败 → 选择器卡片解禁可重试（后端登记已由 finally 回填）
      lastSelectorWrap.querySelectorAll('.order-card').forEach(c => { c.disabled = false; c.classList.remove('picked'); });
    }
  } finally {
    setBusy(false);
    input.focus();
    scrollBottom();
  }
}

async function send() {
  const message = input.value.trim();
  if (!message || streaming) return;
  input.value = '';
  input.style.height = 'auto';

  addRow('user').querySelector('.text').textContent = message;
  const botBubble = addRow('bot');
  botBubble.querySelector('.text').innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  setBusy(true);
  try {
    await streamChat({ conversation_id: conversationId, message, user_id: userId }, botBubble, message);
  } finally {
    scrollBottom();
  }
}

async function resumeWithOrder(order) {
  /** ch06：订单卡片点选 → 用户侧回执 → resume 恢复子流程 */
  const row = addRow('user');
  row.querySelector('.text').textContent = `🧾 我要退订单 ${order.order_no}`;
  const botBubble = addRow('bot');
  botBubble.querySelector('.text').innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  setBusy(true);
  try {
    await streamChat(
      { conversation_id: conversationId, user_id: userId, resume: { order_no: order.order_no } },
      botBubble,
      `我要退订单 ${order.order_no}`
    );
  } finally {
    scrollBottom();
  }
}

document.getElementById('newChat').addEventListener('click', () => {
  if (streaming) return;
  conversationId = null;
  localStorage.removeItem(convKey);
  location.reload();
});
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
