<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城小助手 · 电商智能客服</title>
<style>
  :root {
    --brand: #ff5722;
    --brand-soft: #fff3ef;
    --bg: #f4f5f7;
    --bubble-bot: #ffffff;
    --bubble-user: linear-gradient(135deg, #ff7043, #ff5722);
    --text: #26282c;
    --text-dim: #9aa0a8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #ff7043, #ff5722);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(255, 87, 34, .25);
    z-index: 10;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .status { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #b9f6ca; box-shadow: 0 0 4px #b9f6ca; }
  header .new-chat {
    margin-left: auto;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  header .new-chat:hover { background: rgba(255,255,255,.3); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .row .avatar {
    background: #fff; border: 1px solid #eee;
    width: 34px; height: 34px; font-size: 18px;
  }
  .row.user .avatar { background: var(--brand-soft); border-color: #ffd9cc; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.65;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .row.bot  .bubble { background: var(--bubble-bot); border-top-left-radius: 4px; }
  .row.user .bubble { background: var(--bubble-user); color: #fff; border-top-right-radius: 4px; }
  .bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .row.user .bubble code { background: rgba(255,255,255,.2); }
  .bubble.error { background: #fff1f0; color: #cf1322; border: 1px solid #ffccc7; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px;
    background: var(--brand-soft);
    color: #d84315;
    border: 1px solid #ffd0bf;
    border-radius: 999px;
    padding: 2px 9px;
  }
  .chip.running { animation: pulse 1s infinite; }
  .chip.fail { background: #fff1f0; color: #cf1322; border-color: #ffccc7; }
  @keyframes pulse { 50% { opacity: .45; } }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4 } 30% { transform: translateY(-4px); opacity:1 } }
  footer {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #ececec;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    border: 1px solid #e3e5e8;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color .2s;
  }
  #input:focus { border-color: var(--brand); }
  #send {
    border: none;
    background: var(--brand);
    color: #fff;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: var(--text-dim); padding: 6px 0 10px; }
</style>
</head>
<body>
<header>
  <div class="avatar">🛍️</div>
  <div>
    <h1>商城小助手</h1>
    <div class="status"><span class="dot"></span><span id="statusText">在线 · 为你服务</span></div>
  </div>
  <button class="new-chat" id="newChat">新会话</button>
</header>

<div id="chat">
  <div class="row bot">
    <div class="avatar">🛍️</div>
    <div class="bubble">你好呀～我是商城小助手，可以查订单、物流、商品，也能答售后政策。问点什么？😊</div>
  </div>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</footer>
<div class="hint">ch02 · 工具数据为演示造数；对话与工单已落库</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusText = document.getElementById('statusText');
const newChatBtn = document.getElementById('newChat');

// ── 会话与用户身份（localStorage，DB 为真源，刷新/重开都续上）──
const uidKey = 'cs_user_id_v1', convKey = 'cs_conversation_id_v2';
let userId = localStorage.getItem(uidKey);
if (!userId) {
  userId = crypto.randomUUID();
  localStorage.setItem(uidKey, userId);
}
let conversationId = JSON.parse(localStorage.getItem(convKey) || 'null');

let streaming = false;

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addRow(role) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  row.innerHTML = `<div class="avatar">${role === 'bot' ? '🛍️' : '🙋'}</div>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="tools"></div><div class="text"></div>';
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return bubble;
}

// 最小 Markdown：先转义再渲染 **粗体** 和 `代码`，防注入
function renderMd(el, text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  el.innerHTML = esc
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function addToolChip(bubble, name, running) {
  const chips = bubble.querySelector('.tools');
  const chip = document.createElement('span');
  chip.className = 'chip' + (running ? ' running' : '');
  chip.innerHTML = `🔧 <b>${name}</b> · ${running ? '查询中' : '完成'}`;
  chips.appendChild(chip);
  return chip;
}

function setBusy(b) {
  streaming = b;
  sendBtn.disabled = b;
  input.disabled = b;
  statusText.textContent = b ? '对方正在输入…' : '在线 · 为你服务';
}

async function send() {
  const message = input.value.trim();
  if (!message || streaming) return;
  input.value = '';
  input.style.height = 'auto';

  addRow('user').querySelector('.text').textContent = message;
  const botBubble = addRow('bot');
  botBubble.querySelector('.text').innerHTML =
    '<span class="typing"><i></i><i></i><i></i></span>';
  setBusy(true);

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: conversationId, message, user_id: userId }),
    });
    if (resp.status === 404) {  // 会话过期：清掉本地 id 重开
      conversationId = null;
      localStorage.removeItem(convKey);
      throw new Error('会话已过期，请重新发送');
    }
    if (!resp.ok || !resp.body) throw new Error(`服务异常（HTTP ${resp.status}）`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', firstToken = true, textEl = botBubble.querySelector('.text');

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();                    // 留半截给下一轮
      for (const block of blocks) {
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        if (event === 'meta') {
          conversationId = payload.conversation_id;
          localStorage.setItem(convKey, JSON.stringify(conversationId));
        } else if (event === 'tool') {
          if (payload.status === 'running') {
            addToolChip(botBubble, payload.tool, true);
            statusText.textContent = `正在调用 ${payload.tool}…`;
          } else {
            const chips = botBubble.querySelectorAll('.chip.running');
            const chip = chips[chips.length - 1];
            if (chip) {
              chip.classList.remove('running');
              chip.innerHTML = `🔧 <b>${payload.tool}</b> · ${payload.ok ? '完成' : '失败'}`;
              if (!payload.ok) chip.classList.add('fail');
            }
          }
          scrollBottom();
        } else if (event === 'delta') {
          if (firstToken) { textEl.textContent = ''; firstToken = false; }
          const raw = (textEl.dataset.raw || '') + payload.text;
          textEl.dataset.raw = raw;
          renderMd(textEl, raw);
          scrollBottom();
        } else if (event === 'error') {
          textEl.textContent = '';
          botBubble.classList.add('error');
          renderMd(textEl, payload.message || '服务暂时不可用');
        } else if (event === 'done') {
          delete textEl.dataset.raw;
        }
      }
    }
  } catch (err) {
    const textEl = botBubble.querySelector('.text');
    if (textEl.querySelector('.typing')) textEl.textContent = '';
    botBubble.classList.add('error');
    textEl.textContent = `⚠️ ${err.message || '网络异常，请稍后重试'}`;
  } finally {
    setBusy(false);
    statusText.textContent = '在线 · 为你服务';
    input.focus();
    scrollBottom();
  }
}

newChatBtn.addEventListener('click', () => {
  if (streaming) return;
  conversationId = null;
  localStorage.removeItem(convKey);
  location.reload();
});

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
