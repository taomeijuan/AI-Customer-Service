<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城小助手 · 电商智能客服</title>
<style>
  :root {
    --brand: #ff5722;
    --brand-soft: #fff3ef;
    --bg: #f4f5f7;
    --bubble-bot: #ffffff;
    --bubble-user: linear-gradient(135deg, #ff7043, #ff5722);
    --text: #26282c;
    --text-dim: #9aa0a8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #ff7043, #ff5722);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(255, 87, 34, .25);
    z-index: 10;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .status { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #b9f6ca; box-shadow: 0 0 4px #b9f6ca; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .row .avatar {
    background: #fff; border: 1px solid #eee;
    width: 34px; height: 34px; font-size: 18px;
  }
  .row.user .avatar { background: var(--brand-soft); border-color: #ffd9cc; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.65;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .row.bot  .bubble { background: var(--bubble-bot); border-top-left-radius: 4px; }
  .row.user .bubble { background: var(--bubble-user); color: #fff; border-top-right-radius: 4px; }
  .bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .row.user .bubble code { background: rgba(255,255,255,.2); }
  .bubble.error { background: #fff1f0; color: #cf1322; border: 1px solid #ffccc7; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4 } 30% { transform: translateY(-4px); opacity:1 } }
  footer {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #ececec;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    border: 1px solid #e3e5e8;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color .2s;
  }
  #input:focus { border-color: var(--brand); }
  #send {
    border: none;
    background: var(--brand);
    color: #fff;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: var(--text-dim); padding: 6px 0 10px; }
</style>
</head>
<body>
<header>
  <div class="avatar">🛍️</div>
  <div>
    <h1>商城小助手</h1>
    <div class="status"><span class="dot"></span><span id="statusText">在线 · 为你服务</span></div>
  </div>
</header>

<div id="chat">
  <div class="row bot">
    <div class="avatar">🛍️</div>
    <div class="bubble">你好呀～我是商城小助手，商品、订单、售后问题都可以问我 😊</div>
  </div>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</footer>
<div class="hint">ch01 · 对话由 AI 生成，订单与退款等实时信息以商城页面为准</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusText = document.getElementById('statusText');
let conversationId = null;
let streaming = false;

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addRow(role) {
  const row = document.createElement('div');
  row.className = `row ${role}`;
  row.innerHTML = `<div class="avatar">${role === 'bot' ? '🛍️' : '🙋'}</div>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return bubble;
}

// 最小 Markdown：先转义再渲染 **粗体** 和 `代码`，防注入
function renderMd(el, text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  el.innerHTML = esc
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function setBusy(b) {
  streaming = b;
  sendBtn.disabled = b;
  input.disabled = b;
  statusText.textContent = b ? '对方正在输入…' : '在线 · 为你服务';
}

async function send() {
  const message = input.value.trim();
  if (!message || streaming) return;
  input.value = '';
  input.style.height = 'auto';

  addRow('user').textContent = message;
  const botBubble = addRow('bot');
  botBubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  setBusy(true);

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: conversationId, message }),
    });
    if (resp.status === 404) {  // 会话过期：服务端已失忆，重开再试
      conversationId = null;
      throw new Error('会话已过期，请重新发送');
    }
    if (!resp.ok || !resp.body) throw new Error(`服务异常（HTTP ${resp.status}）`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', firstToken = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();                    // 留半截给下一轮
      for (const block of blocks) {
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        if (event === 'meta') {
          conversationId = payload.conversation_id;
        } else if (event === 'delta') {
          if (firstToken) { botBubble.textContent = ''; firstToken = false; }
          renderMd(botBubble, (botBubble.dataset.raw || '') + payload.text);
          botBubble.dataset.raw = (botBubble.dataset.raw || '') + payload.text;
          scrollBottom();
        } else if (event === 'error') {
          botBubble.textContent = '';
          botBubble.classList.add('error');
          renderMd(botBubble, payload.message || '服务暂时不可用');
        } else if (event === 'done') {
          delete botBubble.dataset.raw;
        }
      }
    }
  } catch (err) {
    if (botBubble.querySelector('.typing')) botBubble.textContent = '';
    botBubble.classList.add('error');
    botBubble.textContent = `⚠️ ${err.message || '网络异常，请稍后重试'}`;
  } finally {
    delete botBubble.dataset.raw;
    setBusy(false);
    input.focus();
    scrollBottom();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
